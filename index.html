<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<meta name="description" content="Every project in one place: status, progress, and what is stuck.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* Shared tokens live in assets/tokens.css, synced from design/tokens.css.
     Only what is specific to this page belongs below. */

  .wrap { max-width: 1180px; margin: 0 auto; padding: var(--s6) var(--s2) var(--s8); }

  header { margin-bottom: var(--s4); }
  h1 { font-size: var(--fs-h2); font-weight: var(--fw-bold); margin-bottom: var(--s0); }
  .sub { color: var(--ink-3); font-size: var(--fs-small); margin: 0; }

  /* Summary tiles ---------------------------------------------------------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: var(--s1); margin: var(--s3) 0 var(--s4); }
  .tile { background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--r3); padding: var(--s2); }
  .tile b { display: block; font-size: var(--fs-h2); font-weight: var(--fw-bold);
            letter-spacing: -0.02em; line-height: var(--lh-tight); }
  .tile span { color: var(--ink-3); font-size: var(--fs-micro); font-weight: var(--fw-semi);
               text-transform: uppercase; letter-spacing: 0.07em; }
  /* Only the two numbers that demand action take colour. */
  .tile.warn b { color: var(--bad); }
  .tile.you b { color: var(--blue); }

  /* Cards ------------------------------------------------------------------ */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--s2); }

  .card { background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--r3); padding: var(--s3);
          display: flex; flex-direction: column; gap: var(--s2); }
  /* A blocked project gets a stronger edge, not a different colour scheme. */
  .card.stuck { border-color: var(--line-strong); }

  .top { display: flex; align-items: flex-start; gap: var(--s1); }
  .name { font-size: var(--fs-h4); font-weight: var(--fw-semi); }
  .one { color: var(--ink-2); font-size: var(--fs-small); margin: var(--s0) 0 0; }

  .pill { font-size: var(--fs-micro); font-weight: var(--fw-semi); text-transform: uppercase;
          letter-spacing: 0.06em; padding: var(--s0) var(--s1); border-radius: var(--rp);
          white-space: nowrap; flex-shrink: 0; border: 1px solid transparent; }
  .pill.live, .pill.earning { background: var(--ok-bg);   color: var(--ok);   border-color: #BBF7D0; }
  .pill.built            { background: var(--blue-bg); color: var(--blue); border-color: #BFDBFE; }
  .pill.building         { background: var(--warn-bg); color: var(--warn); border-color: #FDE68A; }
  .pill.idea             { background: var(--page);    color: var(--ink-3); border-color: var(--line-strong); }

  .bar { height: 6px; background: var(--page); border: 1px solid var(--line);
         border-radius: var(--rp); overflow: hidden; }
  /* The bar stays blue on every card. Blocked is already said three times over
     by the border, the pill and the "Stuck on" box; a fourth signal in a muddy
     text colour only makes the number harder to read. */
  .bar i { display: block; height: 100%; background: var(--blue); }
  .barlab { display: flex; justify-content: space-between; font-size: var(--fs-tiny);
            color: var(--ink-3); margin-bottom: var(--s0); }

  .sect { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: 0.07em;
          color: var(--ink-3); margin: 0 0 var(--s0); font-weight: var(--fw-semi); }
  ul { margin: 0; padding-left: var(--s2); font-size: var(--fs-small); color: var(--ink-2); }
  li { margin-bottom: 2px; }
  li::marker { color: var(--ink-3); }

  .box { border-radius: var(--r2); padding: var(--s1) var(--s2); font-size: var(--fs-small); }
  .box.stuck { background: var(--bad-bg);  border: 1px solid #FECACA; color: var(--ink); }
  .box.you   { background: var(--blue-bg); border: 1px solid #BFDBFE; color: var(--ink); }
  .box.stuck .sect { color: var(--bad); }
  .box.you .sect   { color: var(--blue); }

  .meta { display: flex; flex-wrap: wrap; gap: var(--s0); align-items: center;
          border-top: 1px solid var(--line); padding-top: var(--s2);
          margin-top: auto; font-size: var(--fs-tiny); }
  .meta a { color: var(--blue); text-decoration: none; border: 1px solid var(--line);
            padding: 2px var(--s1); border-radius: var(--r1); }
  .meta a:hover { border-color: var(--blue); background: var(--blue-bg); }
  .chip { color: var(--ink-3); border: 1px solid var(--line); padding: 2px var(--s1);
          border-radius: var(--r1); }
  .chip.down { color: var(--bad); border-color: #FECACA; background: var(--bad-bg); }
  .chip.up   { color: var(--ok);  border-color: #BBF7D0; background: var(--ok-bg); }
  .chip.idle { color: var(--warn); border-color: #FDE68A; background: var(--warn-bg); }

  footer { margin-top: var(--s6); color: var(--ink-3); font-size: var(--fs-tiny); text-align: center; }
  footer code { background: var(--surface); padding: 2px var(--s0);
                border-radius: var(--r1); border: 1px solid var(--line); font-family: var(--mono); }

  @media (max-width: 560px) {
    .wrap { padding: var(--s3) var(--s2) var(--s6); }
    h1 { font-size: var(--fs-h3); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mission Control</h1>
    <p class="sub" id="sub">Loading…</p>
  </header>
  <div class="tiles" id="tiles"></div>
  <div class="grid" id="grid"></div>
  <footer>
    Words come from <code>data/projects.json</code>. Numbers and live status are refreshed automatically.
  </footer>
</div>

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const li  = (arr) => arr.map(x => `<li>${esc(x)}</li>`).join('');

function meta(p) {
  const out = [];
  if (p.url) {
    const up = p.signals.site?.up;
    out.push(`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a>`);
    out.push(`<span class="chip ${up ? 'up' : 'down'}">${up ? 'up' : 'not answering'}</span>`);
  }
  if (p.repo) {
    out.push(`<a href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">${esc(p.repo.split('/')[1])}</a>`);
    const r = p.signals.repo;
    if (r?.visible) {
      if (r.commits) out.push(`<span class="chip">${r.commits} commits</span>`);
      const d = p.signals.idleDays;
      if (d !== null) out.push(`<span class="chip ${d >= 3 ? 'idle' : ''}">${d === 0 ? 'pushed today' : d === 1 ? 'pushed yesterday' : d + ' days idle'}</span>`);
    } else {
      out.push(`<span class="chip">private</span>`);
    }
  } else {
    out.push(`<span class="chip idle">no repo yet</span>`);
  }
  return out.join('');
}

function card(p) {
  const stuck = Boolean(p.blocker);
  return `
  <article class="card ${stuck ? 'stuck' : ''}">
    <div class="top">
      <div style="flex:1;min-width:0">
        <h2 class="name">${esc(p.name)}</h2>
        <p class="one">${esc(p.oneLiner)}</p>
      </div>
      <span class="pill ${esc(p.stage)}">${esc(p.stage)}</span>
    </div>

    <div>
      <div class="barlab"><span>${p.done.length} done, ${p.next.length} to go</span><span>${p.signals.progress}%</span></div>
      <div class="bar"><i style="width:${p.signals.progress}%"></i></div>
    </div>

    <div><p class="sect">Done</p><ul>${li(p.done)}</ul></div>
    <div><p class="sect">Next</p><ul>${li(p.next)}</ul></div>

    ${stuck ? `<div class="box stuck"><p class="sect">Stuck on</p>${esc(p.blocker)}</div>` : ''}
    ${p.needsAjit ? `<div class="box you"><p class="sect">Needs you</p>${esc(p.needsAjit)}</div>` : ''}

    <div class="meta">${meta(p)}</div>
  </article>`;
}

fetch('data/state.json?t=' + Date.now())
  .then(r => r.json())
  .then(s => {
    const when = new Date(s.generatedAt);
    document.getElementById('sub').textContent =
      `${s.summary.total} projects · refreshed ${when.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}`;

    document.getElementById('tiles').innerHTML = [
      ['Projects', s.summary.total, ''],
      ['Live', s.summary.live, ''],
      ['Blocked', s.summary.blocked, 'warn'],
      ['Waiting on you', s.summary.needsAjit, 'you'],
    ].map(([k, v, cls]) => `<div class="tile ${cls}"><b>${v}</b><span>${k}</span></div>`).join('');

    // Stuck things first, then the least recently touched.
    const order = { live: 0, built: 1, building: 2, idea: 3, earning: 0 };
    const sorted = [...s.projects].sort((a, b) =>
      (b.blocker ? 1 : 0) - (a.blocker ? 1 : 0) ||
      (order[a.stage] ?? 9) - (order[b.stage] ?? 9) ||
      (b.signals.idleDays ?? 0) - (a.signals.idleDays ?? 0));

    document.getElementById('grid').innerHTML = sorted.map(card).join('');
  })
  .catch(e => {
    document.getElementById('sub').textContent =
      'Could not load data/state.json. Run npm run build first.';
    console.error(e);
  });
</script>
</body>
</html>
