<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<meta name="description" content="Every project in one place: status, progress, and what is stuck.">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2430;
    --line: #2a313c; --text: #e6edf3; --dim: #8b949e; --faint: #6e7681;
    --live: #3fb950; --built: #58a6ff; --building: #d29922; --idea: #8b949e;
    --alert: #f85149; --you: #d2a8ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 20px 72px; }

  header { margin-bottom: 30px; }
  h1 { font-size: 27px; margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--dim); font-size: 14px; margin: 0; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; margin: 26px 0 32px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 17px; }
  .tile b { display: block; font-size: 25px; font-weight: 650; letter-spacing: -.02em; }
  .tile span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
  .tile.warn b { color: var(--alert); }
  .tile.you b { color: var(--you); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .card.stuck { border-color: #56282a; }

  .top { display: flex; align-items: flex-start; gap: 10px; }
  .name { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .one { color: var(--dim); font-size: 13.5px; margin: 4px 0 0; }

  .pill { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em;
          padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .pill.live     { background: rgba(63,185,80,.14);  color: var(--live);     border: 1px solid rgba(63,185,80,.3); }
  .pill.built    { background: rgba(88,166,255,.14); color: var(--built);    border: 1px solid rgba(88,166,255,.3); }
  .pill.building { background: rgba(210,153,34,.14); color: var(--building); border: 1px solid rgba(210,153,34,.3); }
  .pill.idea, .pill.earning { background: rgba(139,148,158,.14); color: var(--idea); border: 1px solid rgba(139,148,158,.3); }

  .bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--built); border-radius: 3px; }
  .card.stuck .bar i { background: var(--building); }
  .barlab { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-bottom: 5px; }

  .sect { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); margin: 0 0 6px; font-weight: 650; }
  ul { margin: 0; padding-left: 17px; font-size: 13.5px; color: #c9d1d9; }
  li { margin-bottom: 3px; }
  li::marker { color: var(--faint); }

  .box { border-radius: 9px; padding: 11px 13px; font-size: 13.5px; }
  .box.stuck { background: rgba(248,81,73,.07); border: 1px solid rgba(248,81,73,.22); }
  .box.you   { background: rgba(210,168,255,.07); border: 1px solid rgba(210,168,255,.22); }
  .box .sect { margin-bottom: 4px; }
  .box.stuck .sect { color: var(--alert); }
  .box.you .sect { color: var(--you); }

  .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
          border-top: 1px solid var(--line); padding-top: 13px; margin-top: auto; font-size: 12.5px; }
  .meta a { color: var(--built); text-decoration: none; border: 1px solid var(--line);
            padding: 3px 9px; border-radius: 7px; }
  .meta a:hover { border-color: var(--built); }
  .chip { color: var(--dim); border: 1px solid var(--line); padding: 3px 9px; border-radius: 7px; }
  .chip.down { color: var(--alert); border-color: rgba(248,81,73,.35); }
  .chip.up   { color: var(--live);  border-color: rgba(63,185,80,.3); }
  .chip.idle { color: var(--building); border-color: rgba(210,153,34,.3); }

  footer { margin-top: 36px; color: var(--faint); font-size: 12.5px; text-align: center; }
  footer code { background: var(--panel); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); }

  @media (max-width: 560px) { .wrap { padding: 26px 16px 48px; } h1 { font-size: 23px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mission Control</h1>
    <p class="sub" id="sub">Loading…</p>
  </header>
  <div class="tiles" id="tiles"></div>
  <div class="grid" id="grid"></div>
  <footer>
    Words come from <code>data/projects.json</code>. Numbers and live status are refreshed automatically.
  </footer>
</div>

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const li  = (arr) => arr.map(x => `<li>${esc(x)}</li>`).join('');

function meta(p) {
  const out = [];
  if (p.url) {
    const up = p.signals.site?.up;
    out.push(`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a>`);
    out.push(`<span class="chip ${up ? 'up' : 'down'}">${up ? 'up' : 'not answering'}</span>`);
  }
  if (p.repo) {
    out.push(`<a href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">${esc(p.repo.split('/')[1])}</a>`);
    const r = p.signals.repo;
    if (r?.visible) {
      if (r.commits) out.push(`<span class="chip">${r.commits} commits</span>`);
      const d = p.signals.idleDays;
      if (d !== null) out.push(`<span class="chip ${d >= 3 ? 'idle' : ''}">${d === 0 ? 'pushed today' : d === 1 ? 'pushed yesterday' : d + ' days idle'}</span>`);
    } else {
      out.push(`<span class="chip">private</span>`);
    }
  } else {
    out.push(`<span class="chip idle">no repo yet</span>`);
  }
  return out.join('');
}

function card(p) {
  const stuck = Boolean(p.blocker);
  return `
  <article class="card ${stuck ? 'stuck' : ''}">
    <div class="top">
      <div style="flex:1;min-width:0">
        <h2 class="name">${esc(p.name)}</h2>
        <p class="one">${esc(p.oneLiner)}</p>
      </div>
      <span class="pill ${esc(p.stage)}">${esc(p.stage)}</span>
    </div>

    <div>
      <div class="barlab"><span>${p.done.length} done, ${p.next.length} to go</span><span>${p.signals.progress}%</span></div>
      <div class="bar"><i style="width:${p.signals.progress}%"></i></div>
    </div>

    <div><p class="sect">Done</p><ul>${li(p.done)}</ul></div>
    <div><p class="sect">Next</p><ul>${li(p.next)}</ul></div>

    ${stuck ? `<div class="box stuck"><p class="sect">Stuck on</p>${esc(p.blocker)}</div>` : ''}
    ${p.needsAjit ? `<div class="box you"><p class="sect">Needs you</p>${esc(p.needsAjit)}</div>` : ''}

    <div class="meta">${meta(p)}</div>
  </article>`;
}

fetch('data/state.json?t=' + Date.now())
  .then(r => r.json())
  .then(s => {
    const when = new Date(s.generatedAt);
    document.getElementById('sub').textContent =
      `${s.summary.total} projects · refreshed ${when.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}`;

    document.getElementById('tiles').innerHTML = [
      ['Projects', s.summary.total, ''],
      ['Live', s.summary.live, ''],
      ['Blocked', s.summary.blocked, 'warn'],
      ['Waiting on you', s.summary.needsAjit, 'you'],
    ].map(([k, v, cls]) => `<div class="tile ${cls}"><b>${v}</b><span>${k}</span></div>`).join('');

    // Stuck things first, then the least recently touched.
    const order = { live: 0, built: 1, building: 2, idea: 3, earning: 0 };
    const sorted = [...s.projects].sort((a, b) =>
      (b.blocker ? 1 : 0) - (a.blocker ? 1 : 0) ||
      (order[a.stage] ?? 9) - (order[b.stage] ?? 9) ||
      (b.signals.idleDays ?? 0) - (a.signals.idleDays ?? 0));

    document.getElementById('grid').innerHTML = sorted.map(card).join('');
  })
  .catch(e => {
    document.getElementById('sub').textContent =
      'Could not load data/state.json. Run npm run build first.';
    console.error(e);
  });
</script>
</body>
</html>
